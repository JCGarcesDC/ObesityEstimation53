# Docker Compose para API de Predicción de Obesidad
# Configuración para desarrollo y producción

version: '3.8'

services:
  # Servicio principal de API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obesity_api
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=info
      - MODEL_PATH=/app/artefactos/pipelines_optimizados.joblib
    volumes:
      # Montar modelo como volumen (opcional, para actualizaciones sin rebuild)
      - ./artefactos:/app/artefactos:ro
    restart: unless-stopped
    networks:
      - obesity_network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================
  # Servicios adicionales para expansión futura (GCP)
